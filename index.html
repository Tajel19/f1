<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>F1 Mini Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --f1-red: #e10600;
      --f1-dark: #15151e;
      --f1-card: #1f1f2b;
      --green: #2e7d32;
      --red-bg: #c62828;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--f1-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .tab-content { display: none; width: 100%; max-width: 450px; text-align: center; }
    .tab-content.active { display: flex; flex-direction: column; align-items: center; }

    /* Навигация */
    .nav-bar {
      display: flex;
      background: var(--f1-card);
      border-top: 1px solid #333;
      padding: 10px 0;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-btn.active { color: var(--f1-red); }

    .btn {
      margin-top: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: var(--f1-red);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { opacity: 0.8; }

    /* --- 1. ТЕСТ РЕАКЦИИ --- */
    .lights-container {
      display: flex;
      gap: 8px;
      background: #000;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .light { width: 32px; height: 32px; border-radius: 50%; background-color: #333; }
    .light.red { background-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
    .light.green { background-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
    #reaction-result { font-size: 28px; font-weight: bold; margin: 10px 0; }

    /* --- 2. PADDOCK WORDLE --- */
    .select-driver {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: var(--f1-card);
      color: #fff;
      border: 1px solid #444;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .guess-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    .guess-table th { color: #888; padding: 5px; border-bottom: 1px solid #333; }
    .guess-table td {
      padding: 8px 4px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .match { background-color: var(--green); color: #fff; }
    .no-match { background-color: var(--red-bg); color: #fff; }

    /* --- 3. КВИЗ --- */
    .quiz-card {
      background: var(--f1-card);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    
    .quiz-option {
      background: var(--f1-card);
      border: 1px solid #444;
      padding: 14px;
      border-radius: 8px;
      margin: 8px 0;
      width: 100%;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-option:active {
      background-color: var(--f1-red);
      border-color: var(--f1-red);
    }

    #status-msg {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="content">
    <!-- ВКЛАДКА 1: РЕАКЦИЯ -->
    <div id="tab-reaction" class="tab-content active">
      <h2>⚡ Старт F1</h2>
      <p id="reaction-instruction">Жмите "Старт" и ждите зелёных огней</p>
      <div class="lights-container">
        <div class="light" id="l1"></div>
        <div class="light" id="l2"></div>
        <div class="light" id="l3"></div>
        <div class="light" id="l4"></div>
        <div class="light" id="l5"></div>
      </div>
      <div id="reaction-result">0 ms</div>
      <button class="btn" id="reactionBtn" onclick="handleReactionClick()">СТАРТ</button>
    </div>

    <!-- ВКЛАДКА 2: PADDOCK (WORDLE) -->
    <div id="tab-paddock" class="tab-content">
      <h2>🏎️ Угадай гонщика</h2>
      <p style="font-size:13px; color:#aaa;">Случайный пилот загадан! Угадайте его:</p>
      
      <select id="driver-select" class="select-driver">
        <option value="" disabled selected>Выберите пилота...</option>
      </select>
      <button class="btn" onclick="makeGuess()">УГАДАТЬ</button>
      <button class="btn" style="background:#333; margin-top:5px;" onclick="resetWordleGame()">🔄 Новая игра</button>

      <table class="guess-table">
        <thead>
          <tr>
            <th>Пилот</th>
            <th>Нация</th>
            <th>Команда</th>
            <th>Возраст</th>
            <th>Победы</th>
            <th>Дебют</th>
          </tr>
        </thead>
        <tbody id="guesses-body"></tbody>
      </table>
    </div>

    <!-- ВКЛАДКА 3: КВИЗ -->
    <div id="tab-quiz" class="tab-content">
      <h2>❓ F1 Квиз (из Сети)</h2>
      <div class="quiz-card">
        <p id="quiz-question" style="font-size: 17px; font-weight: bold;">Загрузка вопроса из интернета...</p>
      </div>
      <div id="quiz-options" style="width:100%;"></div>
      <div id="status-msg"></div>
      <button class="btn" style="background:#333; margin-top:10px;" onclick="fetchNextQuestion()">⏭️ Следующий вопрос</button>
      <p id="quiz-score" style="margin-top: 15px; color: #888;">Очки: 0</p>
    </div>
  </div>

  <!-- Нижнее меню -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('reaction', this)">⚡ Реакция</button>
    <button class="nav-btn" onclick="switchTab('paddock', this)">🏎️ Угадайка</button>
    <button class="nav-btn" onclick="switchTab('quiz', this)">❓ Квиз</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      btn.classList.add('active');
    }

    // --- 1. РЕАКЦИЯ ---
    let rState = 'IDLE', rStartTime = 0, rTimeouts = [];
    const lights = [1,2,3,4,5].map(i => document.getElementById(`l${i}`));

    function handleReactionClick() {
      const btn = document.getElementById('reactionBtn');
      const inst = document.getElementById('reaction-instruction');
      const res = document.getElementById('reaction-result');

      if (rState === 'IDLE' || rState === 'FINISHED') {
        rState = 'WAITING';
        lights.forEach(l => l.className = 'light');
        inst.innerText = 'Ждите зелёного сигнала...';
        res.innerText = '---';
        btn.innerText = 'ЖМИ ПРИ ЗЕЛЕНОМ!';

        for (let i = 0; i < 5; i++) {
          rTimeouts.push(setTimeout(() => lights[i].classList.add('red'), (i + 1) * 1000));
        }

        const delay = 5000 + Math.random() * 2000;
        rTimeouts.push(setTimeout(() => {
          lights.forEach(l => { l.classList.remove('red'); l.classList.add('green'); });
          rStartTime = Date.now();
          rState = 'READY';
        }, delay));

      } else if (rState === 'WAITING') {
        rTimeouts.forEach(clearTimeout);
        rState = 'FINISHED';
        inst.innerText = 'Фальстарт!';
        res.innerText = '❌';
        btn.innerText = 'ПОПРОБОВАТЬ СНОВА';
        lights.forEach(l => l.className = 'light');
      } else if (rState === 'READY') {
        const time = Date.now() - rStartTime;
        rState = 'FINISHED';
        inst.innerText = 'Ваше время:';
        res.innerText = `${time} ms`;
        btn.innerText = 'ЕЩЕ РАЗ';
        lights.forEach(l => l.className = 'light');
      }
    }

    // --- 2. PADDOCK WORDLE (РАНДОМНЫЕ ПИЛОТЫ) ---
    const drivers = [
      { name: "Max Verstappen", nation: "🇳🇱 Нидерланды", team: "Red Bull", age: 28, wins: 63, debut: 2015 },
      { name: "Lewis Hamilton", nation: "🇬🇧 Великобритания", team: "Ferrari", age: 41, wins: 105, debut: 2007 },
      { name: "Charles Leclerc", nation: "🇲🇨 Монако", team: "Ferrari", age: 28, wins: 8, debut: 2018 },
      { name: "Lando Norris", nation: "🇬🇧 Великобритания", team: "McLaren", age: 26, wins: 4, debut: 2019 },
      { name: "Fernando Alonso", nation: "🇪🇸 Испания", team: "Aston Martin", age: 44, wins: 32, debut: 2001 },
      { name: "George Russell", nation: "🇬🇧 Великобритания", team: "Mercedes", age: 28, wins: 3, debut: 2019 },
      { name: "Oscar Piastri", nation: "🇦🇺 Австралия", team: "McLaren", age: 24, wins: 2, debut: 2023 },
      { name: "Carlos Sainz", nation: "🇪🇸 Испания", team: "Williams", age: 31, wins: 4, debut: 2015 },
      { name: "Michael Schumacher", nation: "🇩🇪 Германия", team: "Ferrari", age: 57, wins: 91, debut: 1991 },
      { name: "Ayrton Senna", nation: "🇧🇷 Бразилия", team: "McLaren", age: 34, wins: 41, debut: 1984 },
      { name: "Sebastian Vettel", nation: "🇩🇪 Германия", team: "Red Bull", age: 38, wins: 53, debut: 2007 },
      { name: "Kimi Raikkonen", nation: "🇫🇮 Финляндия", team: "Ferrari", age: 46, wins: 21, debut: 2001 },
      { name: "Pierre Gasly", nation: "🇫🇷 Франция", team: "Alpine", age: 30, wins: 1, debut: 2017 },
      { name: "Esteban Ocon", nation: "🇫🇷 Франция", team: "Haas", age: 29, wins: 1, debut: 2016 },
      { name: "Nico Hulkenberg", nation: "🇩🇪 Германия", team: "Sauber", age: 38, wins: 0, debut: 2010 }
    ];

    let secretDriver = null;

    // Заполнение выпадающего списка
    const select = document.getElementById('driver-select');
    drivers.forEach((d, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = d.name;
      select.appendChild(opt);
    });

    function resetWordleGame() {
      // Случайный выбор пилота
      secretDriver = drivers[Math.floor(Math.random() * drivers.length)];
      document.getElementById('guesses-body').innerHTML = '';
      select.value = "";
    }

    function makeGuess() {
      const idx = select.value;
      if (idx === "") return;

      const guessed = drivers[idx];
      const tbody = document.getElementById('guesses-body');
      const tr = document.createElement('tr');

      const getCell = (valGuessed, valSecret, isNumber = false) => {
        let cls = "no-match";
        let arrow = "";
        
        if (valGuessed === valSecret) {
          cls = "match";
        } else if (isNumber) {
          arrow = valGuessed < valSecret ? " ⬆️" : " ⬇️";
        }
        return `<td class="${cls}">${valGuessed}${arrow}</td>`;
      };

      tr.innerHTML = `
        <td style="background:#222; color:#fff;">${guessed.name.split(' ')[1]}</td>
        ${getCell(guessed.nation, secretDriver.nation)}
        ${getCell(guessed.team, secretDriver.team)}
        ${getCell(guessed.age, secretDriver.age, true)}
        ${getCell(guessed.wins, secretDriver.wins, true)}
        ${getCell(guessed.debut, secretDriver.debut, true)}
      `;

      tbody.prepend(tr);

      if (guessed.name === secretDriver.name) {
        document.getElementById('status-msg').innerText = `🎉 Поздравляем! Загаданный пилот: ${secretDriver.name}`;
      }
    }

    resetWordleGame(); // Стартуем угадайку

    // --- 3. КВИЗ (ЗАГРУЗКА ИЗ СЕТИ) ---
    let currentCorrectAnswer = "";
    let score = 0;

    // Резервные вопросы (если API временно недоступно)
    const fallbackQuiz = [
      { q: "Какой гонщик выигрывал 7 титулов Чемпиона мира?", a: ["Льюис Хэмилтон", "Макс Ферстаппен", "Шарль Леклер"], correct: "Льюис Хэмилтон" },
      { q: "Сколько красных огней на стартовом светофоре F1?", a: ["3", "5", "10"], correct: "5" },
      { q: "Какой цвет флага означает остановку сессии?", a: ["Желтый", "Красный", "Клетчатый"], correct: "Красный" },
      { q: "В какой стране находится трасса Монца?", a: ["Италия", "Франция", "Испания"], correct: "Италия" }
    ];

    async function fetchNextQuestion() {
      const qEl = document.getElementById('quiz-question');
      const optsEl = document.getElementById('quiz-options');
      const statusMsg = document.getElementById('status-msg');
      
      statusMsg.innerText = '';
      qEl.innerText = 'Загрузка нового вопроса из сети...';
      optsEl.innerHTML = '';

      try {
        // Запрос к Open Trivia API (Категория 21 = Спорт)
        const response = await fetch('https://opentdb.com/api.php?amount=1&category=21&type=multiple');
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const item = data.results[0];
          
          // Декодируем специальное форматирование HTML
          const questionText = decodeHTML(item.question);
          currentCorrectAnswer = decodeHTML(item.correct_answer);
          
          let answers = item.incorrect_answers.map(decodeHTML);
          answers.push(currentCorrectAnswer);
          answers.sort(() => Math.random() - 0.5); // Перемешиваем ответы

          qEl.innerText = questionText;

          answers.forEach(ans => {
            const btn = document.createElement('button');
            btn.className = 'quiz-option';
            btn.innerText = ans;
            btn.onclick = () => checkAnswer(ans);
            optsEl.appendChild(btn);
          });
          return;
        }
      } catch (err) {
        console.log("Ошибка API, используем резервный квиз", err);
      }

      // Если сетевой запрос сорвался — берём из резерва
      const fallback = fallbackQuiz[Math.floor(Math.random() * fallbackQuiz.length)];
      qEl.innerText = fallback.q;
      currentCorrectAnswer = fallback.correct;
      optsEl.innerHTML = '';

      fallback.a.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = ans;
        btn.onclick = () => checkAnswer(ans);
        optsEl.appendChild(btn);
      });
    }

    function decodeHTML(html) {
      const txt = document.createElement("textarea");
      txt.innerHTML = html;
      return txt.value;
    }

    function checkAnswer(userAnswer) {
      const statusMsg = document.getElementById('status-msg');
      if (userAnswer === currentCorrectAnswer) {
        score += 100;
        statusMsg.style.color = '#00ff88';
        statusMsg.innerText = '✅ Правильно! +100 очков';
      } else {
        statusMsg.style.color = '#ff4444';
        statusMsg.innerText = `❌ Ошибка! Правильно: ${currentCorrectAnswer}`;
      }

      document.getElementById('quiz-score').innerText = `Очки: ${score}`;

      setTimeout(() => {
        fetchNextQuestion();
      }, 1500);
    }

    fetchNextQuestion();
  </script>
</body>
</html>

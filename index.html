<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>F1 Mini Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --f1-red: #e10600;
      --f1-dark: #15151e;
      --f1-card: #1f1f2b;
      --green: #2e7d32;
      --red-bg: #c62828;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--f1-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .tab-content { display: none; width: 100%; max-width: 450px; text-align: center; }
    .tab-content.active { display: flex; flex-direction: column; align-items: center; }

    /* Навигация */
    .nav-bar {
      display: flex;
      background: var(--f1-card);
      border-top: 1px solid #333;
      padding: 10px 0;
    }

    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-btn.active { color: var(--f1-red); }

    .btn {
      margin-top: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: var(--f1-red);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { opacity: 0.8; }

    /* --- 1. ТЕСТ РЕАКЦИИ --- */
    .lights-container {
      display: flex;
      gap: 8px;
      background: #000;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .light { width: 32px; height: 32px; border-radius: 50%; background-color: #333; }
    .light.red { background-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
    .light.green { background-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
    #reaction-result { font-size: 28px; font-weight: bold; margin: 10px 0; }

    /* --- 2. PADDOCK WORDLE --- */
    .select-driver {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: var(--f1-card);
      color: #fff;
      border: 1px solid #444;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .guess-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    .guess-table th { color: #888; padding: 5px; border-bottom: 1px solid #333; }
    .guess-table td {
      padding: 8px 4px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .match { background-color: var(--green); color: #fff; }
    .no-match { background-color: var(--red-bg); color: #fff; }

    /* --- 3. КВИЗ --- */
    .quiz-card {
      background: var(--f1-card);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    
    .quiz-option {
      background: var(--f1-card);
      border: 1px solid #444;
      padding: 14px;
      border-radius: 8px;
      margin: 8px 0;
      width: 100%;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-option:active {
      background-color: var(--f1-red);
      border-color: var(--f1-red);
    }

    #status-msg {
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="content">
    <!-- ВКЛАДКА 1: РЕАКЦИЯ -->
    <div id="tab-reaction" class="tab-content active">
      <h2>⚡ Старт F1</h2>
      <p id="reaction-instruction">Жмите "Старт" и ждите зелёных огней</p>
      <div class="lights-container">
        <div class="light" id="l1"></div>
        <div class="light" id="l2"></div>
        <div class="light" id="l3"></div>
        <div class="light" id="l4"></div>
        <div class="light" id="l5"></div>
      </div>
      <div id="reaction-result">0 ms</div>
      <button class="btn" id="reactionBtn" onclick="handleReactionClick()">СТАРТ</button>
    </div>

    <!-- ВКЛАДКА 2: PADDOCK (WORDLE) -->
    <div id="tab-paddock" class="tab-content">
      <h2>🏎️ Угадай гонщика</h2>
      <p style="font-size:13px; color:#aaa;">Загадан один из гонщиков F1 разных эпох! Угадайте его:</p>
      
      <select id="driver-select" class="select-driver">
        <option value="" disabled selected>Выберите пилота...</option>
      </select>
      <button class="btn" onclick="makeGuess()">УГАДАТЬ</button>
      <button class="btn" style="background:#333; margin-top:5px;" onclick="resetWordleGame()">🔄 Новая игра</button>

      <table class="guess-table">
        <thead>
          <tr>
            <th>Пилот</th>
            <th>Нация</th>
            <th>Команда</th>
            <th>Возраст</th>
            <th>Победы</th>
            <th>Дебют</th>
          </tr>
        </thead>
        <tbody id="guesses-body"></tbody>
      </table>
    </div>

    <!-- ВКЛАДКА 3: КВИЗ -->
    <div id="tab-quiz" class="tab-content">
      <h2>❓ F1 Квиз</h2>
      <div class="quiz-card">
        <p id="quiz-question" style="font-size: 17px; font-weight: bold;">Загрузка вопроса...</p>
      </div>
      <div id="quiz-options" style="width:100%;"></div>
      <div id="status-msg"></div>
      <button class="btn" style="background:#333; margin-top:10px;" onclick="nextQuestion()">⏭️ Пропустить вопрос</button>
      <p id="quiz-score" style="margin-top: 15px; color: #888;">Очки: 0</p>
    </div>
  </div>

  <!-- Нижнее меню -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('reaction', this)">⚡ Реакция</button>
    <button class="nav-btn" onclick="switchTab('paddock', this)">🏎️ Угадайка</button>
    <button class="nav-btn" onclick="switchTab('quiz', this)">❓ Квиз</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      btn.classList.add('active');
    }

    // --- 1. РЕАКЦИЯ ---
    let rState = 'IDLE', rStartTime = 0, rTimeouts = [];
    const lights = [1,2,3,4,5].map(i => document.getElementById(`l${i}`));

    function handleReactionClick() {
      const btn = document.getElementById('reactionBtn');
      const inst = document.getElementById('reaction-instruction');
      const res = document.getElementById('reaction-result');

      if (rState === 'IDLE' || rState === 'FINISHED') {
        rState = 'WAITING';
        lights.forEach(l => l.className = 'light');
        inst.innerText = 'Ждите зелёного сигнала...';
        res.innerText = '---';
        btn.innerText = 'ЖМИ ПРИ ЗЕЛЕНОМ!';

        for (let i = 0; i < 5; i++) {
          rTimeouts.push(setTimeout(() => lights[i].classList.add('red'), (i + 1) * 1000));
        }

        const delay = 5000 + Math.random() * 2000;
        rTimeouts.push(setTimeout(() => {
          lights.forEach(l => { l.classList.remove('red'); l.classList.add('green'); });
          rStartTime = Date.now();
          rState = 'READY';
        }, delay));

      } else if (rState === 'WAITING') {
        rTimeouts.forEach(clearTimeout);
        rState = 'FINISHED';
        inst.innerText = 'Фальстарт!';
        res.innerText = '❌';
        btn.innerText = 'ПОПРОБОВАТЬ СНОВА';
        lights.forEach(l => l.className = 'light');
      } else if (rState === 'READY') {
        const time = Date.now() - rStartTime;
        rState = 'FINISHED';
        inst.innerText = 'Ваше время:';
        res.innerText = `${time} ms`;
        btn.innerText = 'ЕЩЕ РАЗ';
        lights.forEach(l => l.className = 'light');
      }
    }

    // --- 2. PADDOCK WORDLE ---
    const drivers = [
      { name: "Max Verstappen", nation: "🇳🇱 Нидерланды", team: "Red Bull", age: 28, wins: 63, debut: 2015 },
      { name: "Lewis Hamilton", nation: "🇬🇧 Великобритания", team: "Ferrari", age: 41, wins: 105, debut: 2007 },
      { name: "Charles Leclerc", nation: "🇲🇨 Монако", team: "Ferrari", age: 28, wins: 8, debut: 2018 },
      { name: "Lando Norris", nation: "🇬🇧 Великобритания", team: "McLaren", age: 26, wins: 4, debut: 2019 },
      { name: "Fernando Alonso", nation: "🇪🇸 Испания", team: "Aston Martin", age: 44, wins: 32, debut: 2001 },
      { name: "George Russell", nation: "🇬🇧 Великобритания", team: "Mercedes", age: 28, wins: 3, debut: 2019 },
      { name: "Oscar Piastri", nation: "🇦🇺 Австралия", team: "McLaren", age: 24, wins: 2, debut: 2023 },
      { name: "Carlos Sainz", nation: "🇪🇸 Испания", team: "Williams", age: 31, wins: 4, debut: 2015 },
      { name: "Pierre Gasly", nation: "🇫🇷 Франция", team: "Alpine", age: 30, wins: 1, debut: 2017 },
      { name: "Esteban Ocon", nation: "🇫🇷 Франция", team: "Haas", age: 29, wins: 1, debut: 2016 },
      { name: "Nico Hulkenberg", nation: "🇩🇪 Германия", team: "Sauber", age: 38, wins: 0, debut: 2010 },
      { name: "Valtteri Bottas", nation: "🇫🇮 Финляндия", team: "Sauber", age: 36, wins: 10, debut: 2013 },
      { name: "Daniel Ricciardo", nation: "🇦🇺 Австралия", team: "RB", age: 36, wins: 8, debut: 2011 },
      { name: "Yuki Tsunoda", nation: "🇯🇵 Япония", team: "RB", age: 25, wins: 0, debut: 2021 },
      { name: "Alexander Albon", nation: "🇹🇭 Таиланд", team: "Williams", age: 29, wins: 0, debut: 2019 },
      { name: "Lance Stroll", nation: "🇨🇦 Канада", team: "Aston Martin", age: 27, wins: 0, debut: 2017 },
      { name: "Kevin Magnussen", nation: "🇩🇰 Дания", team: "Haas", age: 33, wins: 0, debut: 2014 },
      { name: "Liam Lawson", nation: "🇳🇿 Новая Зеландия", team: "RB", age: 24, wins: 0, debut: 2023 },
      { name: "Franco Colapinto", nation: "🇦🇷 Аргентина", team: "Williams", age: 22, wins: 0, debut: 2024 },
      { name: "Oliver Bearman", nation: "🇬🇧 Великобритания", team: "Haas", age: 20, wins: 0, debut: 2024 },
      { name: "Michael Schumacher", nation: "🇩🇪 Германия", team: "Ferrari", age: 57, wins: 91, debut: 1991 },
      { name: "Ayrton Senna", nation: "🇧🇷 Бразилия", team: "McLaren", age: 34, wins: 41, debut: 1984 },
      { name: "Alain Prost", nation: "🇫🇷 Франция", team: "McLaren", age: 71, wins: 51, debut: 1980 },
      { name: "Sebastian Vettel", nation: "🇩🇪 Германия", team: "Red Bull", age: 38, wins: 53, debut: 2007 },
      { name: "Kimi Raikkonen", nation: "🇫🇮 Финляндия", team: "Ferrari", age: 46, wins: 21, debut: 2001 },
      { name: "Niki Lauda", nation: "🇦🇹 Австрия", team: "Ferrari", age: 70, wins: 25, debut: 1971 },
      { name: "Juan Manuel Fangio", nation: "🇦🇷 Аргентина", team: "Mercedes", age: 84, wins: 24, debut: 1950 },
      { name: "Jim Clark", nation: "🇬🇧 Великобритания", team: "Lotus", age: 32, wins: 25, debut: 1960 },
      { name: "Jackie Stewart", nation: "🇬🇧 Великобритания", team: "Tyrrell", age: 86, wins: 27, debut: 1965 },
      { name: "Nigel Mansell", nation: "🇬🇧 Великобритания", team: "Williams", age: 72, wins: 31, debut: 1980 },
      { name: "Nelson Piquet", nation: "🇧🇷 Бразилия", team: "Brabham", age: 73, wins: 23, debut: 1978 },
      { name: "Mika Hakkinen", nation: "🇫🇮 Финляндия", team: "McLaren", age: 57, wins: 20, debut: 1991 },
      { name: "Damon Hill", nation: "🇬🇧 Великобритания", team: "Williams", age: 65, wins: 22, debut: 1992 },
      { name: "Jacques Villeneuve", nation: "🇨🇦 Канада", team: "Williams", age: 54, wins: 11, debut: 1996 },
      { name: "Jenson Button", nation: "🇬🇧 Великобритания", team: "Brawn GP", age: 46, wins: 15, debut: 2000 },
      { name: "Nico Rosberg", nation: "🇩🇪 Германия", team: "Mercedes", age: 40, wins: 23, debut: 2006 },
      { name: "Rubens Barrichello", nation: "🇧🇷 Бразилия", team: "Ferrari", age: 53, wins: 11, debut: 1993 },
      { name: "Felipe Massa", nation: "🇧🇷 Бразилия", team: "Ferrari", age: 44, wins: 11, debut: 2002 },
      { name: "David Coulthard", nation: "🇬🇧 Великобритания", team: "McLaren", age: 54, wins: 13, debut: 1994 },
      { name: "Mark Webber", nation: "🇦🇺 Австралия", team: "Red Bull", age: 49, wins: 9, debut: 2002 },
      { name: "Giancarlo Fisichella", nation: "🇮🇹 Италия", team: "Renault", age: 53, wins: 3, debut: 1996 },
      { name: "Juan Pablo Montoya", nation: "🇨🇴 Колумбия", team: "Williams", age: 50, wins: 7, debut: 2001 },
      { name: "Daniil Kvyat", nation: "🇷🇺 Россия", team: "Red Bull", age: 31, wins: 0, debut: 2014 },
      { name: "Jean Alesi", nation: "🇫🇷 Франция", team: "Ferrari", age: 61, wins: 1, debut: 1989 },
      { name: "Gerhard Berger", nation: "🇦🇹 Австрия", team: "Ferrari", age: 66, wins: 10, debut: 1984 }
    ];

    // Сначала сортируем список пилотов по имени
    drivers.sort((a, b) => a.name.localeCompare(b.name));

    let secretDriver = null;

    // После сортировки наполняем списки выбора
    const select = document.getElementById('driver-select');
    function initDriverSelect() {
      select.innerHTML = '<option value="" disabled selected>Выберите пилота...</option>';
      drivers.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = d.name;
        select.appendChild(opt);
      });
    }
    initDriverSelect();

    function resetWordleGame() {
      // Честный рандомный выбор пилота
      const randomIndex = Math.floor(Math.random() * drivers.length);
      secretDriver = drivers[randomIndex];
      document.getElementById('guesses-body').innerHTML = '';
      select.value = "";
    }

    function makeGuess() {
      const idx = select.value;
      if (idx === "" || idx === null) return;

      const guessed = drivers[parseInt(idx, 10)];
      const tbody = document.getElementById('guesses-body');
      const tr = document.createElement('tr');

      const getCell = (valGuessed, valSecret, isNumber = false) => {
        let cls = "no-match";
        let arrow = "";
        
        if (valGuessed === valSecret) {
          cls = "match";
        } else if (isNumber) {
          arrow = valGuessed < valSecret ? " ⬆️" : " ⬇️";
        }
        return `<td class="${cls}">${valGuessed}${arrow}</td>`;
      };

      const surname = guessed.name.split(' ').slice(-1)[0];

      tr.innerHTML = `
        <td style="background:#222; color:#fff;">${surname}</td>
        ${getCell(guessed.nation, secretDriver.nation)}
        ${getCell(guessed.team, secretDriver.team)}
        ${getCell(guessed.age, secretDriver.age, true)}
        ${getCell(guessed.wins, secretDriver.wins, true)}
        ${getCell(guessed.debut, secretDriver.debut, true)}
      `;

      tbody.prepend(tr);

      if (guessed.name === secretDriver.name) {
        document.getElementById('status-msg').innerText = `🎉 Поздравляем! Загаданный пилот: ${secretDriver.name}`;
      }
    }

    resetWordleGame();

    // --- 3. КВИЗ (СИСТЕМА БЕЗ ПОВТОРЕНИЙ) ---
    const f1QuizData = [
      { q: "Какой гонщик выигрывал 7 титулов Чемпиона мира F1 вместе с Михаэлем Шумахером?", a: ["Льюис Хэмилтон", "Макс Ферстаппен", "Шарль Леклер"], correct: 0 },
      { q: "Сколько красных огней загорается на стартовом светофоре F1?", a: ["3", "5", "10"], correct: 1 },
      { q: "Какой цвет флага означает полную остановку сессии/гонки?", a: ["Желтый", "Красный", "Клетчатый"], correct: 1 },
      { q: "В какой стране находится легендарная трасса «Монца»?", a: ["Италия", "Франция", "Испания"], correct: 0 },
      { q: "Какая команда Formula 1 известна под прозвищем «Скудерия»?", a: ["Mercedes", "Ferrari", "Red Bull"], correct: 1 },
      { q: "Какой пилот стал самым молодым чемпионом мира в истории F1?", a: ["Макс Ферстаппен", "Себастьян Феттель", "Льюис Хэмилтон"], correct: 1 },
      { q: "Сколько колес разрешено менять на пит-стопе во время гонки?", a: ["2", "4", "Сколько угодно"], correct: 1 },
      { q: "В каком году Айртон Сенна выиграл свой первый титул F1?", a: ["1988", "1991", "1985"], correct: 0 },
      { q: "Как называется система снижения лобового сопротивления для обгона?", a: ["KERS", "DRS", "HALO"], correct: 1 },
      { q: "Как называется защитная дуга над кабиной пилота F1?", a: ["HALO", "DRS", "Monocoque"], correct: 0 },
      { q: "Какая команда выиграла Кубок Конструкторов 2023 года?", a: ["Ferrari", "Red Bull Racing", "McLaren"], correct: 1 },
      { q: "Где проходит единственный ночной Гран-при при искусственном освещении среди узких городских улиц?", a: ["Сингапур", "Монако", "Баку"], correct: 0 },
      { q: "Какое максимальное количество очков дается за победу в основной гонке (без учета быстрого круга)?", a: ["25", "18", "15"], correct: 0 },
      { q: "Какой цвет имеют шины типа Soft (Мягкие)?", a: ["Желтый", "Красный", "Белый"], correct: 1 }
    ];

    let quizDeck = [];
    let currentQuizItem = null;
    let score = 0;

    // Перемешивание массива колоды
    function shuffleQuizDeck() {
      quizDeck = [...f1QuizData];
      for (let i = quizDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [quizDeck[i], quizDeck[j]] = [quizDeck[j], quizDeck[i]];
      }
    }

    function nextQuestion() {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.innerText = '';

      // Если вопросы в колоде закончились — перемешиваем заново
      if (quizDeck.length === 0) {
        shuffleQuizDeck();
      }

      currentQuizItem = quizDeck.pop();

      document.getElementById('quiz-question').innerText = currentQuizItem.q;
      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';

      currentQuizItem.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => answerF1Quiz(idx);
        optsContainer.appendChild(btn);
      });
    }

    function answerF1Quiz(selectedIdx) {
      const statusMsg = document.getElementById('status-msg');

      if (selectedIdx === currentQuizItem.correct) {
        score += 100;
        statusMsg.style.color = '#00ff88';
        statusMsg.innerText = '✅ Правильно! +100 очков';
      } else {
        statusMsg.style.color = '#ff4444';
        statusMsg.innerText = `❌ Неверно! Правильно: ${currentQuizItem.a[currentQuizItem.correct]}`;
      }

      document.getElementById('quiz-score').innerText = `Очки: ${score}`;

      setTimeout(() => {
        nextQuestion();
      }, 1200);
    }

    shuffleQuizDeck();
    nextQuestion();
  </script>
</body>
</html>
